];
const INFO={"Tata Nano": "Launched 2008. 624cc twin-cylinder petrol.", "Hindustan Ambassador": "Built 1958 to 2014. 1.5L petrol and diesel.", "Maruti 800": "Launched 1983. 796cc petrol.", "Premier Padmini": "Launched 1964. 1.1L petrol.", "Mahindra Thar": "Launched 2010. 2020 update in second generation.", "Tata Sierra": "Launched 1991. 2.0L turbo-diesel.", "Maruti Suzuki Jimny": "Five-door India launch 2023. 1.5L petrol.", "Hyundai Santro": "Launched 1998. 1.1L petrol.", "Tata Safari": "Launched 1998. 2.0L diesel.", "Mahindra Scorpio": "Launched 2002. Diesel engine.", "Hindustan Contessa": "Launched 1984. 1.8L petrol.", "Toyota Innova": "Launched 2005. Diesel and petrol.", "Maruti Suzuki Gypsy": "Launched 1985. 1.3L petrol.", "Tata Punch": "Launched 2021. 1.2L petrol."};
const DB={"Maruti Suzuki": ["800", "Alto", "Alto K10", "S-Presso", "Wagon R", "Celerio", "Ignis", "Swift", "Dzire", "Baleno", "Fronx", "Brezza", "Victoris", "Grand Vitara", "Ertiga", "XL6", "Invicto", "Jimny", "Eeco", "e Vitara", "Omni", "Gypsy", "Zen"], "Tata": ["Tiago", "Tiago EV", "Tigor", "Altroz", "Punch", "Punch EV", "Nexon", "Nexon EV", "Curvv", "Curvv EV", "Harrier", "Harrier EV", "Safari", "Sierra", "Aeris", "Indica", "Nano"], "Mahindra": ["Thar", "Thar Roxx", "Scorpio", "Scorpio N", "Scorpio Classic", "Bolero", "Bolero Neo", "XUV 3XO", "XUV700", "XUV 7XO", "XUV500", "XEV 9e", "XEV 9S", "BE 6", "Marazzo"], "Hyundai": ["Grand i10 Nios", "Aura", "i20", "Exter", "Venue", "Verna", "Creta", "Creta Electric", "Alcazar", "Tucson", "Ioniq 5", "Santro"], "Kia": ["Sonet", "Seltos", "Syros", "Carens", "Carens Clavis", "Carnival", "EV6", "EV9"], "Toyota": ["Glanza", "Urban Cruiser Taisor", "Urban Cruiser Hyryder", "Rumion", "Innova", "Innova Crysta", "Innova Hycross", "Fortuner", "Hilux", "Camry", "Vellfire", "Land Cruiser 300"], "Honda": ["Amaze", "City", "Elevate"], "MG": ["Comet EV", "Astor", "Hector", "Windsor EV", "ZS EV", "Gloster", "M9", "Cyberster"], "Skoda": ["Kylaq", "Kushaq", "Slavia", "Kodiaq", "Superb", "Octavia RS"], "Volkswagen": ["Virtus", "Taigun", "Tiguan", "Golf GTI"], "Renault": ["Kwid", "Triber", "Kiger", "Duster"], "Nissan": ["Magnite", "Gravite", "Tekton", "X-Trail"], "Citroen": ["C3", "eC3", "Aircross", "Basalt", "C5 Aircross"], "Jeep": ["Compass", "Meridian", "Wrangler", "Grand Cherokee"], "Isuzu": ["D-Max V-Cross", "Hi-Lander", "MU-X"], "BYD": ["Atto 3", "Seal", "Sealion 7", "eMAX 7"], "VinFast": ["VF 6", "VF 7"], "Mercedes-Benz": ["C-Class", "E-Class", "S-Class", "GLA", "GLC", "GLE", "GLS", "G-Class", "EQS", "Maybach S-Class"], "BMW": ["2 Series Gran Coupe", "3 Series", "5 Series", "7 Series", "X1", "X3", "X5", "X7", "iX1", "i7"], "Audi": ["A4", "A6", "Q3", "Q5", "Q7", "Q8", "e-tron GT"], "Volvo": ["EX30", "EX40", "XC60", "XC90"], "Lexus": ["ES", "NX", "RX", "LM", "LX"], "Porsche": ["Macan", "Cayenne", "Panamera", "911", "Taycan"], "Land Rover": ["Defender", "Discovery", "Range Rover", "Range Rover Sport", "Velar", "Evoque"], "Mini": ["Cooper", "Countryman"], "Lamborghini": ["Urus", "Revuelto"], "Ferrari": ["Purosangue", "296 GTB", "Roma"], "Rolls-Royce": ["Ghost", "Cullinan"], "Bentley": ["Continental GT", "Flying Spur", "Bentayga"], "Aston Martin": ["DB12", "Vantage"], "Lotus": ["Emira", "Eletre"], "Force": ["Gurkha"], "Bajaj": ["Qute"], "Hindustan Motors": ["Ambassador", "Contessa"], "Premier": ["Padmini"], "Ford": ["EcoSport", "Figo", "Endeavour"]};
const BA={Maruti:'Maruti Suzuki',Hindustan:'Hindustan Motors'};
const bm=c=>BA[c.b]||c.b;
const mm=c=>c.n.replace(new RegExp('^('+Object.keys(DB).concat(['Maruti','Hindustan']).sort((a,b)=>b.length-a.length).join('|')+') '),'');
const app=document.getElementById("app");
let QUESTIONS,deck,i,lvl,score,streak,best=0,results,tried;
try{best=+localStorage.getItem("gtg-best")||0}catch(e){}
const pts=[100,80,60,40,20];
const RANKS=[[0,"Learner's Licence"],[250,"Weekend Driver"],[500,"Highway Cruiser"],[750,"Auto Expo Insider"],[950,"Gaadi Guru"]];
const rank=x=>RANKS.filter(r=>x>=r[0]).pop()[1];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const GROUPS=[
["Maruti Suzuki","Tata","Mahindra","Hyundai","Kia","Toyota","Honda","Skoda","Volkswagen","Renault","Nissan","Citroen","Jeep","Isuzu","MG","BYD","VinFast","Force","Ford"],
["Mercedes-Benz","BMW","Audi","Volvo","Lexus","Porsche","Land Rover","Mini"],
["Lamborghini","Ferrari","Rolls-Royce","Bentley","Aston Martin","Lotus"],
["Hindustan Motors","Premier","Bajaj"]
];
function buildBrandOpts(correct){
 const group=GROUPS.find(g=>g.includes(correct))||Object.keys(DB);
 let rivals=shuffle(group.filter(b=>b!==correct));
 let opts=[correct,...rivals.slice(0,4)];
 let pool=shuffle(Object.keys(DB).filter(b=>!opts.includes(b)));
 while(opts.length<5&&pool.length)opts.push(pool.pop());
 return shuffle(opts);
}
function buildQuestions(){
 const qs=[];
 CARS.forEach(c=>{
  const angles=[c.c[0],c.c[1],c.f].filter(Boolean);
  angles.forEach((primary,idx)=>{
   const rest=angles.filter((_,j)=>j!==idx);
   qs.push({car:c,primary:primary,rest:rest});
  });
 });
 return qs;
}
function pickDeck(n){
 const pool=shuffle(buildQuestions());
 const used=new Set(),picked=[];
 for(const q of pool){if(picked.length>=n)break;if(used.has(q.car.n))continue;used.add(q.car.n);picked.push(q)}
 if(picked.length<n)for(const q of pool){if(picked.length>=n)break;picked.push(q)}
 return picked;
}
function start(){QUESTIONS=buildQuestions();deck=pickDeck(10);i=0;lvl=0;score=0;streak=0;results=[];tried=[];round()}
function plate(c,full){const m=mm(c).toUpperCase();return '<div class="pl" aria-label="Model name has '+m.replace(/ /g,"").length+' letters">'+m.split("").map((ch,k)=>ch===" "?'<span class="sp"></span>':'<span class="ch">'+(full||(lvl>=4&&(k===0||k===m.length-1))?ch:"")+'</span>').join("")+'</div>'}
function head(){return '<div class="bar"><span>Car '+(i+1)+' of '+deck.length+'</span><span>'+score+' pts'+(streak>1?' · 🔥'+streak:'')+'</span></div>'}
function round(msg,cls){
 const q=deck[i],c=q.car;
 const H=[["Another unique quality",q.rest[0]],["One more unique quality",q.rest[1]],["Spec sheet",c.i||INFO[c.n]||""],["Brand",bm(c)],["Number plate","The first and last letters are now filled in."]];
 let h='<div class="plate">'+head();
 h+='<div class="dots" aria-label="Hints used">'+pts.map((_,k)=>'<span class="'+(k<lvl?"on":"")+'"></span>').join("")+'</div>';
 h+='<p class="clue">'+q.primary+'</p>';
 h+='<p class="hint"><b>Body and era:</b> It is '+c.s+'.</p>';
 h+=plate(c);
 for(let k=0;k<=lvl&&k<H.length;k++)h+='<p class="hint'+(k===lvl?" new":"")+'"><b>'+H[k][0]+':</b> '+H[k][1]+'</p>';
 if(tried.length)h+='<p class="tried">Not: '+tried.join(", ")+'</p>';
 if(!q.brandOpts)q.brandOpts=buildBrandOpts(bm(c));
 h+='<div class="row"><select id="sb" aria-label="Brand"><option value="">Brand</option>'+q.brandOpts.map(b=>'<option>'+b+'</option>').join('')+'</select><select id="sm" aria-label="Model" disabled><option value="">Model</option></select></div>';
 h+='<div class="row"><button id="go">Guess</button><button class="alt" id="skip">Give up</button></div>';
 h+='<div class="msg '+(cls||"")+'" id="m">'+(msg||"Worth "+pts[lvl]+" points. Wrong guesses unlock more hints.")+'</div></div>';
 app.innerHTML=h;
 const sb=document.getElementById("sb"),sm=document.getElementById("sm");
 sb.onchange=()=>{sm.innerHTML='<option value="">Model</option>'+(DB[sb.value]||[]).map(x=>'<option>'+x+'</option>').join("");sm.disabled=!sb.value};
 if(lvl>=3){sb.value=bm(c);sb.onchange()}
 document.getElementById("go").onclick=()=>{
  if(!sb.value||!sm.value){document.getElementById("m").textContent="Pick a brand and a model first.";return}
  if(sb.value===bm(c)&&sm.value===mm(c)){streak++;const bonus=Math.min(50,Math.max(0,streak-2)*10);const g=pts[lvl]+bonus;score+=g;results.push(lvl<=1?"🟩":lvl<=3?"🟨":"🟧");reveal(true,g,bonus)}
  else if(lvl<4){tried.push(sb.value+" "+sm.value);lvl++;round("Not quite. A new hint just unlocked.","bad")}
  else{streak=0;results.push("🟥");reveal(false,0,0)}};
 document.getElementById("skip").onclick=()=>{streak=0;results.push("🟥");reveal(false,0,0)};
}
function reveal(ok,g,bonus){
 const q=deck[i],c=q.car;
 app.innerHTML='<div class="plate">'+head()+plate(c,true)
 +'<p class="clue '+(ok?"ok":"bad")+'">'+(ok?"Correct! +"+g+(bonus?" (streak bonus "+bonus+")":""):"It was the "+c.n)+'</p>'
 +'<p><b>'+c.n+'</b> is '+c.s+'.</p><div class="fact">'+c.f+'</div><p class="sub">'+(c.i||INFO[c.n]||"")+'</p>'
 +'<div class="actions"><button id="next">'+(i+1<deck.length?"Next car":"See results")+'</button></div></div>';
 const nb=document.getElementById("next");nb.focus();
 nb.onclick=()=>{i++;lvl=0;tried=[];i<deck.length?round():end()};
}
function end(){
 if(score>best){best=score;try{localStorage.setItem("gtg-best",best)}catch(e){}}
 const txt="Guess the Gaadi: "+score+" pts, "+rank(score)+"\n"+results.join("");
 app.innerHTML='<div class="plate"><p class="sub">Your rank</p><div class="rank">'+rank(score)+'</div><div class="big">'+score+'</div><p>Best on this device: '+best+'</p><p>'+results.join("")+'</p><p class="sub">🟩 one or two hints · 🟨 three or four · 🟧 all hints · 🟥 missed</p>'
 +'<div class="actions"><button id="again">Play again</button><button class="alt" id="share">Copy result</button></div><div class="msg" id="m"></div></div>';
 document.getElementById("again").onclick=start;
 document.getElementById("share").onclick=()=>{
  const done=()=>document.getElementById("m").textContent="Copied. Paste it to challenge a friend.";
  try{navigator.clipboard.writeText(txt).then(done,()=>document.getElementById("m").textContent=txt)}catch(e){document.getElementById("m").textContent=txt}};
}
start();
</script>
