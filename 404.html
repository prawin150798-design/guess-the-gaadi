<title>Page not found · Guess the Gaadi</title>

<style>
:root{--bg:#f7c600;--ink:#141208;--card:#fffdf2;--mute:#5b5320;--line:#141208;

html{scroll-padding-top:env(safe-area-inset-top,0px)}

main{max-width:480px;margin:0 auto;padding:20px 16px 40px;text-align:center}
.plate{background:var(--card);border:3px solid var(--line);border-radius:10px;padding:32px 22px;outline:2px solid var(--line);outline-offset:-9px}
.code{font:400 clamp(60px,18vw,96px)/1 "Archivo Black",Impact,sans-serif;margin:0}
h1{font:400 clamp(22px,6vw,30px)/1.3 "Archivo Black",Impact,sans-serif;margin:8px 0 6px}
p{color:var(--mute);margin:0 0 20px}
a.btn{display:inline-block;font:600 16px "Work Sans",sans-serif;padding:12px 20px;border:3px solid var(--line);border-radius:8px;background:var(--ink);color:var(--bg);text-decoration:none}
</style>
</head>
